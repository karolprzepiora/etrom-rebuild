<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ETROM</title>
  <meta name="description" content="ETROM — projekty, etapy, zadania i zespół biura projektowego.">

  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/logo.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/signature.css">
  <link rel="stylesheet" href="styles/flow.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/views.css">
  <link rel="stylesheet" href="styles/portfolio.css">
  <link rel="stylesheet" href="styles/project.css">

<body>
  <a class="skip-link" href="#main">Przejdź do treści</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Nawigacja"></aside>
    <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

    <div class="sheet" id="sheet">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" id="action-nav" aria-label="Otwórz nawigację" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="topbar__crumb" id="crumb" aria-label="Ścieżka"></nav>
        <span class="topbar__spacer"></span>
        <div class="topbar__timer" id="timer-slot"></div>
        <div class="topbar__actions" id="topbar-actions"></div>
      </header>

      <div class="sheet__scroll" id="scroller">
        <main class="page" id="main" tabindex="-1">
          <div id="notice"></div>

          <section class="view" id="view-projects" aria-labelledby="projects-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="projects-title">Projekty</h1>
                <p class="page-header__description" id="projects-summary"></p>
              </div>
              <div class="page-header__actions">
                <button class="btn btn--primary" type="button" id="action-new" aria-keyshortcuts="N">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                  <span>Nowy projekt</span><kbd class="kbd">N</kbd>
                </button>
              </div>
            </header>
            <div id="views-bar" class="pf-views-bar"></div>
            <section class="pf-strip-wrap" id="portfolio" aria-label="Stan portfela"></section>
            <div class="pf-layout">
              <div class="list-block">
                <div class="toolbar" id="filters" role="search" aria-label="Filtry projektów"></div>
                <div id="project-list"></div>
                <div id="bulk-bar" class="bulk-slot"></div>
              </div>
              <aside class="pf-rail" id="rail-wrap" aria-label="Najbliższe terminy"><div id="rail"></div></aside>
            </div>
          </section>

          <section class="view" id="view-project" hidden aria-labelledby="project-title">
            <div class="detail" id="project-view"></div>
          </section>

          <section class="view" id="view-feed" hidden aria-labelledby="feed-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="feed-title">Aktualności</h1>
                <p class="page-header__description" id="feed-summary"></p>
              </div>
            </header>
            <div id="feed-body"></div>
          </section>

          <section class="view" id="view-analysis" hidden aria-labelledby="analysis-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="analysis-title">Analiza</h1>
                <p class="page-header__description" id="analysis-summary"></p>
              </div>
              <div class="page-header__actions" id="analysis-tools"></div>
            </header>
            <div id="analysis-body"></div>
          </section>

          <section class="view" id="view-time" hidden aria-labelledby="time-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="time-title">Czas</h1>
                <p class="page-header__description" id="time-summary"></p>
              </div>
              <div class="page-header__actions" id="time-tools"></div>
            </header>
            <div id="time-body"></div>
          </section>

          <section class="view" id="view-dashboard" hidden aria-label="Pulpit">
            <div id="dashboard-body"></div>
          </section>

          <section class="view" id="view-mywork" hidden aria-labelledby="mywork-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="mywork-title">Moja praca</h1>
                <p class="page-header__description" id="mywork-summary"></p>
              </div>
              <div class="page-header__actions" id="mywork-who"></div>
            </header>
            <div id="mywork-body"></div>
          </section>

          <section class="view" id="view-plan" hidden aria-labelledby="plan-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="plan-title">Plan</h1>
                <p class="page-header__description" id="plan-summary"></p>
              </div>
            </header>
            <div id="plan-body"></div>
          </section>

          <section class="view" id="view-calendar" hidden aria-labelledby="calendar-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="calendar-title">Kalendarz</h1>
                <p class="page-header__description" id="calendar-summary"></p>
              </div>
            </header>
            <div id="calendar-body"></div>
          </section>

          <section class="view" id="view-orders" hidden aria-labelledby="orders-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="orders-title">Zlecenia</h1>
                <p class="page-header__description" id="orders-summary"></p>
              </div>
            </header>
            <div id="orders-body"></div>
          </section>

          <section class="view" id="view-leave" hidden aria-labelledby="leave-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="leave-title">Urlopy</h1>
                <p class="page-header__description" id="leave-summary"></p>
              </div>
            </header>
            <div id="leave-body"></div>
          </section>

          <section class="view" id="view-review" hidden aria-labelledby="review-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="review-title">Przegląd</h1>
                <p class="page-header__description" id="review-summary"></p>
              </div>
            </header>
            <div id="review-body"></div>
          </section>

          <section class="view" id="view-library" hidden aria-labelledby="library-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="library-title">Biblioteka</h1>
                <p class="page-header__description" id="library-summary"></p>
              </div>
            </header>
            <div id="library-body"></div>
          </section>

          <section class="view" id="view-team" hidden aria-labelledby="team-title">
            <header class="page-header">
              <div class="page-header__main">
                <h1 class="t-page-title" id="team-title">Zespół</h1>
                <p class="page-header__description" id="team-summary"></p>
              </div>
              <div class="page-header__actions">
                <button class="btn btn--primary" type="button" id="action-new-person" aria-keyshortcuts="N">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                  <span>Nowa osoba</span><kbd class="kbd">N</kbd>
                </button>
              </div>
            </header>
            <div class="list-block">
              <div id="team-tabs"></div>
              <div class="toolbar" id="team-filters" role="search" aria-label="Filtry osób"></div>
              <div id="team-list"></div>
            </div>
          </section>
        </main>
      </div>

      <aside class="inspector" id="inspector" hidden aria-label="Inspektor"></aside>
    </div>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">
