<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETROM — projekty i etapy</title>
  <meta name="description" content="ETROM — prowadzenie projektów, etapów i terminów w biurze projektowym.">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail"></aside>

    <div class="content">
      <header class="topbar">
        <p class="topbar__path">ETROM / <strong>Projekty</strong></p>
        <span class="topbar__spacer"></span>
        <button class="btn btn--primary" type="button" id="action-new">Nowy projekt <kbd class="kbd">N</kbd></button>
        <button class="btn" type="button" id="action-demo">Dane testowe</button>
        <button class="btn" type="button" id="action-export">Pobierz kopię</button>
        <button class="btn" type="button" id="action-import">Wczytaj kopię</button>
        <button class="btn btn--danger" type="button" id="action-clear">Wyczyść</button>
        <input type="file" id="import-file" accept="application/json,.json" class="sr-only" tabindex="-1">
      </header>

      <main class="screen">
        <div class="screen__head">
          <div>
            <h1 class="screen__title">Projekty</h1>
            <p class="screen__lede">Terminy umów, postęp rzeczowy i stan etapów w jednym miejscu.</p>
          </div>
        </div>

        <p class="notice notice--hidden" id="notice" role="status" aria-live="polite"></p>
        <div class="filters" id="filters"></div>
        <div id="project-list"></div>
      </main>

      <footer class="statusbar">
        <span id="summary"></span>
        <span id="save-state">Zapis lokalny</span>
        <span class="statusbar__spacer"></span>
        <span>Dane zostają na tym urządzeniu. Przed przeniesieniem folderu pobierz kopię JSON.</span>
      </footer>
    </div>
  </div>

  <!-- Klasyczne skrypty w kolejności zależności: działa po dwukliku z dysku (file://),
       bez serwera i bez kompilacji. Moduły ES nie zadziałałyby z file:// (CORS). -->
  <script src="src/core/catalog.js"></script>
  <script src="src/core/model.js"></script>
  <script src="src/core/progress.js"></script>
  <script src="src/core/query.js"></script>
  <script src="src/core/storage.js"></script>
  <script src="src/core/store.js"></script>
  <script src="src/core/identity.js"></script>
  <script src="src/core/prefs.js"></script>
  <script src="src/core/search.js"></script>
  <script src="src/ui/dom.js"></script>
  <script src="src/ui/icons.js"></script>
  <script src="src/ui/motion.js"></script>
  <script src="src/ui/dialog.js"></script>
  <script src="src/ui/toast.js"></script>
  <script src="src/ui/palette.js"></script>
  <script src="src/ui/stageList.js"></script>
  <script src="src/ui/projectCard.js"></script>
  <script src="src/ui/projectTable.js"></script>
  <script src="src/ui/projectForm.js"></script>
  <script src="src/ui/app.js"></script>
</body>
</html>
